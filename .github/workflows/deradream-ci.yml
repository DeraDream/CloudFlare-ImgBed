name: DeraDream Fork CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Python syntax
        run: |
          python3 -m py_compile telegram-bot/bot.py telegram-bot/history_store.py updater/server.py


      - name: Build combined ImgBed image
        run: |
          docker build -t deradream-imgbed:test .

      - name: Combined container process smoke test
        run: |
          docker run -d --name imgbed-combined-test -p 18080:8080 \
            -e PROJECT_DIR=/tmp/nonexistent-project \
            deradream-imgbed:test
          trap 'docker logs imgbed-combined-test || true; docker rm -f imgbed-combined-test >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18080/ >/dev/null
          curl -fsS http://127.0.0.1:18080/view/preview-smoke-test | grep -q 'mobile-toolbar'
          for i in $(seq 1 15); do
            STATUS="$(docker exec imgbed-combined-test supervisorctl -c /etc/supervisord.conf status || true)"
            echo "$STATUS"
            if echo "$STATUS" | grep -q '^imgbed.*RUNNING' \
              && echo "$STATUS" | grep -q '^telegram-bot.*RUNNING' \
              && echo "$STATUS" | grep -q '^updater.*RUNNING'; then
              break
            fi
            sleep 1
          done
          docker exec imgbed-combined-test sh -c "supervisorctl -c /etc/supervisord.conf status imgbed | grep RUNNING"
          docker exec imgbed-combined-test sh -c "supervisorctl -c /etc/supervisord.conf status telegram-bot | grep RUNNING"
          docker exec imgbed-combined-test sh -c "supervisorctl -c /etc/supervisord.conf status updater | grep RUNNING"
          docker logs imgbed-combined-test

      - name: Telegram bot feature smoke test
        run: |
          docker run --rm \
            -w /app/telegram-bot \
            -e BOT_DB_PATH=/tmp/bot-test.db \
            -e BOT_TIMEZONE=Asia/Shanghai \
            deradream-imgbed:test python -c "
          import asyncio
          import bot
          from history_store import create_history, find_duplicate, get_history, update_history

          asyncio.set_event_loop(None)
          try:
              asyncio.get_event_loop()
          except RuntimeError:
              pass
          else:
              raise AssertionError('expected no implicit event loop')
          bot.ensure_main_event_loop()
          assert asyncio.get_event_loop() is not None
          asyncio.get_event_loop().close()
          asyncio.set_event_loop(None)

          bot.init_db()
          tags, note = bot.parse_caption_metadata('#服务器 #截图 测试备注')
          assert tags == ['服务器', '截图'], (tags, note)
          assert note == '测试备注', note
          s = bot.update_settings(10001, upload_folder='/telegram', auto_date_dir=True)
          folder = bot.effective_upload_folder(s)
          assert folder.startswith('/telegram/'), folder
          hid = create_history(bot.DB_PATH, {
              'user_id': 10001, 'chat_id': 10001, 'original_name': 'a.jpg',
              'final_name': 'a.jpg', 'mime_type': 'image/jpeg',
              'channel_type': 's3', 'channel_name': 'cloudflare',
              'upload_folder': folder, 'sha256': 'abc',
              'url': 'https://img.example.com/a.jpg', 'status': 'success'
          })
          row = find_duplicate(
              bot.DB_PATH, sha256='abc', channel_type='s3',
              channel_name='cloudflare', upload_folder=folder, user_id=10001
          )
          assert row and row['id'] == hid
          update_history(
              bot.DB_PATH, hid,
              tags=['x'], note='n',
              preview_url='https://img.example.com/view/test'
          )
          saved = get_history(bot.DB_PATH, hid)
          assert saved['note'] == 'n'
          assert saved['preview_url'] == 'https://img.example.com/view/test'
          print('telegram feature smoke test: OK')
          "

      - name: Frontend bundle syntax
        run: |
          node --check frontend-dist/js/app.1e4229a6.js
          node --check frontend-dist/js/502.58060353.js
          node --check frontend-dist/js/757.27c783c1.js

      - name: Docker Compose config
        run: |
          IMGBED_PUBLIC_URL=https://img.example.com docker compose config >/dev/null
