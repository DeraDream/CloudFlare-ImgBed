services:
  imgbed:
    build: .
    image: deradream/cloudflare-imgbed:local
    ports:
      - "127.0.0.1:7658:8080"
    environment:
      UPDATE_AGENT_URL: http://updater:8081
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  telegram-bot:
    build:
      context: ./telegram-bot
    container_name: imgbed-telegram-bot
    depends_on:
      - imgbed
      - updater
    environment:
      # BOT_TOKEN / IMGBED_API_TOKEN / ALLOWED_USER_IDS 可选。
      # 留空时 Bot 会从 ImgBed 后台「Telegram Bot 上传配置」读取。
      BOT_TOKEN: ${BOT_TOKEN:-}
      IMGBED_URL: http://imgbed:8080
      IMGBED_PUBLIC_URL: ${IMGBED_PUBLIC_URL}
      IMGBED_API_TOKEN: ${IMGBED_API_TOKEN:-}
      ALLOWED_USER_IDS: ${ALLOWED_USER_IDS:-}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-120}
      BOT_DB_PATH: /data/bot.db
      IMGBED_DB_PATH: /imgbed-data/database.sqlite
      UPDATE_AGENT_URL: http://updater:8081
    volumes:
      - ./telegram-bot-data:/data
      - ./data:/imgbed-data:ro
    restart: unless-stopped

  updater:
    build:
      context: ./updater
    container_name: imgbed-updater
    environment:
      PROJECT_DIR: ${PROJECT_DIR:-/opt/docker/cloudflare-imgbed}
      REPO_BRANCH: main
      EXPECTED_REPO: DeraDream/CloudFlare-ImgBed
      REPO_URL: https://github.com/DeraDream/CloudFlare-ImgBed.git
      UPDATE_PORT: 8081
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PROJECT_DIR:-/opt/docker/cloudflare-imgbed}:${PROJECT_DIR:-/opt/docker/cloudflare-imgbed}
    restart: unless-stopped
