services:
  imgbed:
    build: .
    image: deradream/cloudflare-imgbed:local
    container_name: imgbed
    ports:
      - "127.0.0.1:7658:8080"
    environment:
      # ImgBed
      PORT: 8080

      # Telegram Bot（留空时从 ImgBed 后台「Telegram Bot 上传配置」读取）
      BOT_TOKEN: ${BOT_TOKEN:-}
      IMGBED_URL: http://127.0.0.1:8080
      IMGBED_PUBLIC_URL: ${IMGBED_PUBLIC_URL}
      IMGBED_API_TOKEN: ${IMGBED_API_TOKEN:-}
      ALLOWED_USER_IDS: ${ALLOWED_USER_IDS:-}
      REQUEST_TIMEOUT: ${REQUEST_TIMEOUT:-120}
      BOT_TIMEZONE: ${BOT_TIMEZONE:-Asia/Shanghai}
      BOT_DB_PATH: /app/telegram-bot-data/bot.db
      IMGBED_DB_PATH: /app/data/database.sqlite

      # 内置在线更新器
      UPDATE_AGENT_URL: http://127.0.0.1:8081
      UPDATE_HOST: 127.0.0.1
      UPDATE_PORT: 8081
      PROJECT_DIR: ${PROJECT_DIR:-/opt/docker/cloudflare-imgbed}
      REPO_BRANCH: main
      EXPECTED_REPO: DeraDream/CloudFlare-ImgBed
      REPO_URL: https://github.com/DeraDream/CloudFlare-ImgBed.git

    volumes:
      # ImgBed 数据
      - ./data:/app/data

      # 保留原 Telegram Bot SQLite，不迁移/不丢历史
      - ./telegram-bot-data:/app/telegram-bot-data

      # 在线升级需要控制本机 Docker，并读取当前 Git 工作目录
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PROJECT_DIR:-/opt/docker/cloudflare-imgbed}:${PROJECT_DIR:-/opt/docker/cloudflare-imgbed}

    restart: unless-stopped
